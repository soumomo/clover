[project]
name = "clover"
version = "0.1.0"
description = "High-Resolution Optical Canopy Delineation & Allometric Biomass Auditing Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "streamlit-folium>=0.20.0",
    "folium>=0.16.0",
    "branca>=0.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rasterio>=1.3.10",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pytorch-lightning>=2.2.0",
    "ultralytics>=8.2.0",
    "deepforest>=2.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["canopy_core*"]
